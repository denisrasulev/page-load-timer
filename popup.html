<!DOCTYPE html>
<html lang="en" class="theme-auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Load Timer</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --bg-page: #f9fafb;
            --surface-color: #ffffff;
            --surface-hover: #eef0f3;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --danger: #ef4444;
            --danger-bg: #fde8e8;
            --warning: #f59e0b;
            --toggle-bg: #d1d5db;
            --toggle-knob: #ffffff;
            --shadow: rgba(0,0,0,0.05);
            --badge-js-bg: #eff6ff;     --badge-js-fg: #3b82f6;
            --badge-css-bg: #fdf2f8;    --badge-css-fg: #db2777;
            --badge-img-bg: #ecfdf5;    --badge-img-fg: #059669;
            --badge-xhr-bg: #fef3c7;    --badge-xhr-fg: #d97706;
            --badge-font-bg: #ede9fe;   --badge-font-fg: #7c3aed;
            --badge-other-bg: #f3f4f6;  --badge-other-fg: #4b5563;
        }

        /* Dark theme — applied by JS class */
        :root.theme-dark {
            --bg-color: #1a1a2e;
            --bg-page: #12121f;
            --surface-color: #1e1e32;
            --surface-hover: #2a2a44;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #2e2e48;
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --danger: #f87171;
            --danger-bg: #3b1a1a;
            --warning: #fbbf24;
            --toggle-bg: #4a4a6a;
            --toggle-knob: #e2e8f0;
            --shadow: rgba(0,0,0,0.3);
            --badge-js-bg: #1e293b;     --badge-js-fg: #60a5fa;
            --badge-css-bg: #2d1a2e;    --badge-css-fg: #f472b6;
            --badge-img-bg: #1a2e22;    --badge-img-fg: #34d399;
            --badge-xhr-bg: #2e2a1a;    --badge-xhr-fg: #fbbf24;
            --badge-font-bg: #251e3e;   --badge-font-fg: #a78bfa;
            --badge-other-bg: #252538;  --badge-other-fg: #94a3b8;
        }

        /* Auto theme — follows OS preference (duplicates dark vars; CSS has no
           cross-block variable reuse, so this is the standard pattern) */
        @media (prefers-color-scheme: dark) {
            :root.theme-auto {
                --bg-color: #1a1a2e;
                --bg-page: #12121f;
                --surface-color: #1e1e32;
                --surface-hover: #2a2a44;
                --text-primary: #e2e8f0;
                --text-secondary: #94a3b8;
                --border-color: #2e2e48;
                --accent-blue: #60a5fa;
                --accent-green: #34d399;
                --danger: #f87171;
                --danger-bg: #3b1a1a;
                --warning: #fbbf24;
                --toggle-bg: #4a4a6a;
                --toggle-knob: #e2e8f0;
                --shadow: rgba(0,0,0,0.3);
                --badge-js-bg: #1e293b;     --badge-js-fg: #60a5fa;
                --badge-css-bg: #2d1a2e;    --badge-css-fg: #f472b6;
                --badge-img-bg: #1a2e22;    --badge-img-fg: #34d399;
                --badge-xhr-bg: #2e2a1a;    --badge-xhr-fg: #fbbf24;
                --badge-font-bg: #251e3e;   --badge-font-fg: #a78bfa;
                --badge-other-bg: #252538;  --badge-other-fg: #94a3b8;
            }
        }

        body {
            width: 450px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
        }

        .container {
            padding: 14px 20px 16px;
        }

        /* Header */
        header {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Settings button */
        .settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: var(--text-secondary);
            padding: 4px;
            line-height: 1;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .settings-btn:hover {
            color: var(--text-primary);
        }

        /* View switching */
        .view-hidden {
            display: none;
        }

        /* Settings view */
        #settings-view header {
            margin-bottom: 8px;
        }

        .settings-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 13px;
            color: var(--text-primary);
        }

        .settings-select {
            font-size: 12px;
            font-family: inherit;
            height: 20px;
            padding: 0 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--surface-color);
            color: var(--text-primary);
            cursor: pointer;
            outline: none;
        }

        .settings-select:focus {
            border-color: var(--accent-blue);
        }

        /* Toggle switch */
        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            border-radius: 20px;
            transition: background-color 0.2s;
        }

        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: var(--toggle-knob);
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle input:checked + .toggle-slider {
            background-color: var(--accent-blue);
        }

        .toggle input:checked + .toggle-slider::before {
            transform: translateX(16px);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .metric-card {
            background: var(--surface-color);
            padding: 10px 4px;
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .metric-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .metric-value.highlight {
            color: var(--accent-blue);
        }

        /* Table Section */
        .table-container {
            background: var(--surface-color);
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            text-align: left;
            padding: 7px 16px;
            background-color: var(--surface-hover);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 6px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Resource styling */
        .resource-name {
            display: block;
            max-width: 170px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
            font-weight: 500;
        }

        .th-right {
            text-align: right;
        }

        .resource-time {
            text-align: right;
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            color: var(--text-secondary);
        }

        .resource-size {
            text-align: right;
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .cached-size {
            font-style: italic;
            opacity: 0.7;
        }

        .slow-time {
            color: var(--danger);
            font-weight: 600;
        }

        /* Badges for types */
        .badge {
            display: inline-block;
            width: 42px;
            padding: 2px 0;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            text-align: center;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .badge.js { background-color: var(--badge-js-bg); color: var(--badge-js-fg); }
        .badge.css { background-color: var(--badge-css-bg); color: var(--badge-css-fg); }
        .badge.img { background-color: var(--badge-img-bg); color: var(--badge-img-fg); }
        .badge.xhr { background-color: var(--badge-xhr-bg); color: var(--badge-xhr-fg); }
        .badge.font { background-color: var(--badge-font-bg); color: var(--badge-font-fg); }
        .badge.other { background-color: var(--badge-other-bg); color: var(--badge-other-fg); }

        .resource-row {
            display: flex;
            align-items: center;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        /* Timeline table — mono for data cells only; headers use the shared th style */
        .timeline-table td {
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 12px;
        }

        .timeline-table td:first-child {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 500;
        }

        .timeline-table td:not(:first-child) {
            text-align: right;
            color: var(--text-secondary);
        }

        .timeline-table th:not(:first-child) {
            text-align: right;
        }

        .timeline-slowest td {
            background-color: var(--danger-bg);
            color: var(--danger);
            font-weight: 600;
        }

        .timeline-slowest td:first-child {
            color: var(--danger);
        }

        .section-gap {
            margin-bottom: 16px;
        }

        /* Density: roomy — scoped to main view only */
        body.density-roomy #main-view {
            padding: 4px;
        }

        body.density-roomy #main-view header {
            margin-bottom: 20px;
        }

        body.density-roomy #main-view .metrics-grid {
            gap: 10px;
            margin-bottom: 20px;
        }

        body.density-roomy #main-view .metric-card {
            padding: 12px 4px;
        }

        body.density-roomy #main-view .metric-value {
            font-size: 14px;
        }

        body.density-roomy #main-view th {
            padding: 10px 16px;
        }

        body.density-roomy #main-view td {
            padding: 10px 16px;
        }

        body.density-roomy #main-view .section-gap {
            margin-bottom: 20px;
        }

        body.density-roomy .container {
            padding-bottom: 20px;
        }

        body.density-roomy .settings-item {
            padding: 18px 0;
        }

        /* Density: default — base styles, no overrides needed */

        /* Density: compact — scoped to main view only */
        body.density-compact #main-view header {
            margin-bottom: 10px;
        }

        body.density-compact #main-view .metrics-grid {
            gap: 6px;
            margin-bottom: 10px;
        }

        body.density-compact #main-view .metric-card {
            padding: 6px 3px;
        }

        body.density-compact #main-view .metric-label {
            font-size: 9px;
            margin-bottom: 2px;
        }

        body.density-compact #main-view .metric-value {
            font-size: 12px;
        }

        body.density-compact #main-view th {
            padding: 4px 12px;
        }

        body.density-compact #main-view td {
            padding: 3px 12px;
        }

        body.density-compact #main-view .section-gap {
            margin-bottom: 10px;
        }

        body.density-compact .container {
            padding-bottom: 10px;
        }

        body.density-compact .settings-item {
            padding: 10px 0;
        }

        /* Section visibility */
        .section-hidden {
            display: none;
        }

        /* Footer */
        .footer {
            position: sticky;
            bottom: 0;
            text-align: center;
            padding: 6px 20px;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-page);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 11px;
            transition: color 0.15s;
        }

        .footer a:hover {
            color: var(--accent-blue);
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Main View -->
        <div id="main-view">
        <header>
            <h2>Page Performance</h2>
            <button id="settings-btn" class="settings-btn" title="Settings">&#9881;</button>
        </header>

        <!-- Top Metrics Cards -->
        <div id="vitals-section" class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Page Load</div>
                <div class="metric-value highlight" id="load-time">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">FCP</div>
                <div class="metric-value" id="fcp-time">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">LCP</div>
                <div class="metric-value" id="lcp-time">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">TTFB</div>
                <div class="metric-value" id="ttfb-time">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">DCL</div>
                <div class="metric-value" id="dcl-time">--</div>
            </div>
        </div>

        <!-- Load Timeline -->
        <div id="timeline-section" class="table-container section-gap">
            <table class="timeline-table">
                <thead>
                    <tr>
                        <th>Load Timeline</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="timeline-body">
                </tbody>
            </table>
        </div>

        <!-- Resources Table -->
        <div id="resources-section" class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Top Slow Resources</th>
                        <th class="th-right">Size</th>
                        <th class="th-right">Time</th>
                    </tr>
                </thead>
                <tbody id="resources-body">
                </tbody>
            </table>
        </div>
        </div>

        <!-- Settings View -->
        <div id="settings-view" class="view-hidden">
        <header>
            <h2>Settings</h2>
            <button id="settings-back" class="settings-btn" title="Back">&#8249;</button>
        </header>

        <ul class="settings-list">
            <li class="settings-item">
                <div class="settings-label">Theme ("Auto" follows system)</div>
                <select id="theme-select" class="settings-select">
                    <option value="auto" selected>Auto</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </li>
            <li class="settings-item">
                <div class="settings-label">Choose information density</div>
                <select id="density-select" class="settings-select">
                    <option value="roomy">Roomy</option>
                    <option value="default" selected>Default</option>
                    <option value="compact">Compact</option>
                </select>
            </li>
            <li class="settings-item">
                <div class="settings-label">Show load time on the icon</div>
                <label class="toggle">
                    <input type="checkbox" id="badge-toggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </li>
            <li class="settings-item">
                <div class="settings-label">Show page load phases</div>
                <label class="toggle">
                    <input type="checkbox" id="timeline-toggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </li>
            <li class="settings-item">
                <div class="settings-label">Show top slow resources</div>
                <label class="toggle">
                    <input type="checkbox" id="resources-toggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </li>
        </ul>
        </div>
    </div>

    <footer class="footer">
        <a href="https://denshub.com/" target="_blank" rel="noopener">denshub.com</a>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
